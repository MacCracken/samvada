name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-
    # verify step below enforces semver shape + match against
    # the VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

# Least privilege (0.5.1, audit MED-9). This used to be `contents: write` at
# WORKFLOW level, so every job — including the one that piped a remote script
# into sh — ran with a token that could rewrite the repo and the release tag.
# Write is now granted only to the job that actually publishes.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.3.0 == 1.3.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Single source of truth is the cyrius.cyml pin. The installer is
        # fetched from a PINNED COMMIT and checksum-verified before it runs —
        # see ci.yml for the full rationale (0.5.1, audit MED-9). Keep the
        # SHA/SUM here in step with ci.yml's.
        env:
          CYRIUS_INSTALL_SHA: "6020f5ba5f2986ab5d83de277a589c072133678e"
          CYRIUS_INSTALL_SUM: "f33ee940c1387205f10f852c823b56983f5f44fda7ba3c2eff9af6917c3a8d51"
          # sha256 of cyrius-<version>-x86_64-linux.tar.gz itself.
          CYRIUS_TARBALL_SUM: "a85cca2c510cfe48590eed93273fe317521d62e07046bc568508e8a45c990325"
        run: |
          set -euo pipefail
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSfL -o install.sh \
            "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_INSTALL_SHA}/scripts/install.sh"
          echo "${CYRIUS_INSTALL_SUM}  install.sh" | sha256sum -c -
          # Pin the toolchain BYTES, not merely the installer script.
          # install.sh's Ed25519 check needs a pre-existing trusted
          # `cyrsign`; a clean runner has none, so _verify_signature()
          # returns 2 and SKIPS before it even fetches the signature.
          # Integrity then reduced to a .sha256 sidecar served from the
          # same origin as the tarball — same host, same compromise.
          # Fetching it ourselves against a sum pinned IN THIS REPO is
          # what makes the toolchain reproducible from the repo alone.
          # Bump deliberately alongside the cyrius.cyml version pin; a
          # version bump without a sum bump fails loudly here, which is
          # the point.
          curl -sSfL -o cyrius.tar.gz \
            "https://github.com/MacCracken/cyrius/releases/download/${CYRIUS_VERSION}/cyrius-${CYRIUS_VERSION}-x86_64-linux.tar.gz"
          echo "${CYRIUS_TARBALL_SUM}  cyrius.tar.gz" | sha256sum -c -
          CYRIUS_VERSION="$CYRIUS_VERSION" \
            CYRIUS_INSTALL_TARBALL="$PWD/cyrius.tar.gz" sh install.sh
          rm -f install.sh cyrius.tar.gz
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Build
        # CYRIUS_DCE=1 is declared the CI default in CLAUDE.md but no workflow
        # ever set it, so every published binary carried its dead code —
        # including unreachable exec/fork/socket stdlib bodies (audit LOW-16).
        # DCE genuinely eliminates as of cyrius 6.5.72; measured 80,904 ->
        # 15,368 bytes on this binary.
        env:
          CYRIUS_DCE: "1"
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/samvada
          echo "samvada: $(wc -c < build/samvada) bytes"

      - name: Test
        run: cyrius test

      - name: Regenerate dist bundle
        run: cyrius distlib

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Source tarball (matches yukti's pattern — consumers
          # who want to build from scratch grab this).
          git archive --format=tar.gz --prefix="samvada-${TAG}/" -o "samvada-${TAG}-src.tar.gz" HEAD
          # Bundled lib for [deps.samvada] consumers — same file
          # as dist/samvada.cyr, renamed with version suffix so
          # it survives outside the source tree.
          cp dist/samvada.cyr "samvada-${TAG}.cyr"
          # Standalone smoke binary so contributors can verify
          # the build without a Cyrius toolchain.
          cp build/samvada "samvada-${TAG}-x86_64-linux"
          # C shim is just a .c file — ship it next to the bundle
          # so consumers that point at this release artifact
          # don't have to clone the repo to get the shim.
          cp deps/samvada_main.c "samvada-${TAG}-shim.c"
          sha256sum samvada-*.tar.gz samvada-*.cyr samvada-*-linux samvada-*-shim.c > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-artifacts
          path: |
            samvada-*.tar.gz
            samvada-*.cyr
            samvada-*-linux
            samvada-*-shim.c
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # The ONLY job that needs write: it publishes the release. Every other
    # job runs read-only (0.5.1, audit MED-9).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-artifacts
      - name: Changelog
        # Extract the section between `## [TAG]` and the next
        # `## [` heading so the release body shows just this
        # version's notes.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: "samvada ${{ github.ref_name }}"
          body_path: /tmp/body.md
          # 0.x tags ship as prereleases — surface gates aren't
          # met yet (no live-bus e2e through a consumer).
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            samvada-*.tar.gz
            samvada-*.cyr
            samvada-*-linux
            samvada-*-shim.c
            SHA256SUMS
